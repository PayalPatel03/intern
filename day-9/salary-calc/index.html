<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salary-Calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="container">
        <h2 class="fw-bold text-center">Salary-Calculator</h2>
      
        <div class="mb-3">
          <label class="form-label text-danger fw-bold"
            >Basic Salary:</label
          >
          <input
            type="number"
            class="form-control"
            id="basic"
            placeholder="Enter Salary"
          />
        </div>
        <div class="mb-3">
          <label class="form-label text-danger fw-bold"
            >Allowance:</label
          >
          <input
            type="number"
            class="form-control"
            id="allowances"
            placeholder="Enter Allowance"
          />
        </div>
         <div class="mb-3">
          <label class="form-label text-danger fw-bold"
            >Deducations:</label
          >
          <input
            type="number"
            class="form-control"
            id="deductions"
            placeholder="Enter Deducations"
          />
        </div>
         <div class="mb-3">
          <label class="form-label text-danger fw-bold"
            >Tax Rate(%):</label
          >
          <input
            type="number"
            class="form-control"
            id="tax"
            placeholder="Enter Tax rate in %"
          />
        </div>
         <div class="mb-3">
          <label class="form-label text-danger fw-bold"
            >OverTime Hours:</label
          >
          <input
            type="number"
            class="form-control"
            id="otHours"
            placeholder="Enter Overtime hrs"
          />
        </div>
         <div class="mb-3">
          <label class="form-label text-danger fw-bold"
            >OverTime Rate:</label
          >
          <input
            type="number"
            class="form-control"
            id="otRate"
            placeholder="Enter OverTime rate"
          />
        </div>
        <div>
      <button class="btn btn-secondary" onclick="calculateSalary()">Calculate</button>
      <button class="reset btn btn-secondary" onclick="resetForm()">Reset</button>
    </div>

    <div class="result" id="resultBox"></div>
        
        
      
    </div>

    <script src="./js/script.js"></script>
  </body>
</html>
