<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login-Reg</title>
    <!--bootstrap css cdn-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
  <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <!-- sign up form start  -->
                <form id="form" method="post">
                    <h1 id="title">signup</h1>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" name="email" class="form-control" id="email">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" id="password">
                    </div>
                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>
                <!-- sign up form end  -->

                <!-- login form start  -->
                <form id="form1" method="post">
                    <h1 id="title">login</h1>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" name="email" class="form-control" id="email1">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" id="password1"
>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>
                <!-- login form end  -->
            </div>

            <!--card-->
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card mt-3 mx-auto" id="card" style="width: 18rem;">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQPskciyBO8oJnB3tL1b8VRZ9Yr6dMwE7dFeQ&s"
                            height="200px" class="card-img-top" alt="...">
                        <div class="card-body">
                            <h5 class="card-title" id="username">Card title</h5>
                            <p class="card-text">Some quick example text to build on the card title and make up the bulk of
                                the card's content.</p>
                        </div>
                    </div>
                </div>
            </div>
           
        </div>
    </div>

    <!--bootstrap js cdn-->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
