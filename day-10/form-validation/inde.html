<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Form-validation</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
      <div class="container mt-5">
        <div class="row justify-content-center">
        <div class="col-md-6">
          <form
            action=""
            method="post"
            onsubmit="
              validate();
              return false;
            "
          >
            <h2 class="fw-bold text-center mb-5">Sign-Up</h2>
            <!--name-->
            <div class="mb-3">
              <label for="username" class="form-label fw-semibold">Username:</label>
              <input placeholder="Enter Name" type="text" class="form-control" id="username" />
              <span class="d-none userError text-danger"
                >Username is required.</span>
            </div>

            <!--email-->
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">Email:</label>
              <input placeholder="Enter Email" type="text" class="form-control" id="email" />
              <span class="d-none emailError text-danger"
                >Email is required.</span>
            </div>

            <!--password-->
            <div class="mb-3">
              <label for="password" class="form-label fw-semibold">Password:</label>
              <input placeholder="Enter Password" type="password" class="form-control" id="password" />
              <span class="d-none passwordError text-danger"
                >Password is required.</span>
            </div>
            <button class="btn btn-info">Submit</button>
          </form>
        </div>
      </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
